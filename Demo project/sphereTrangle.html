<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

 <link rel="stylesheet" href="style.css">

<body>
  
 <button id="m6" onclick="window.location.reload()">RI</button> 
  
  <script type="module">
import * as THREE from '../jsm/three.module.js';
import { OrbitControls } from './jsm/OrbitControls.js';
import * as CANNON from '../jsm/cannon-es.js';


// ---------------- Scene ----------------
const scene = new THREE.Scene()

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  100
)
camera.position.set(0, 8, 15)

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);

renderer.setSize(window.innerWidth, window.innerHeight)
document.body.appendChild(renderer.domElement)

// ---------------- Physics World ----------------
const world = new CANNON.World()
world.gravity.set(0, -9.82, 0)

//____________carBody____________










//________carBodyEnd__________
// ---------------- Triangle Terrain ----------------
// 3 vertices = 1 triangle

let vertices,indices;

const terrainGeo = new THREE.BufferGeometry();



vertices =new Float32Array([
  -60, 60, 0,
   60, 60, 1,
   
   
 60, -60, 0,
-60, -60, 1,
])
indices = [0, 1, 2, 2,3,0]

// Three Mesh

terrainGeo.setAttribute(
  'position',new THREE.Float32BufferAttribute(vertices,3));
  
terrainGeo.setIndex(indices)
terrainGeo.computeVertexNormals()

const terrainMesh = new THREE.Mesh(
  terrainGeo,
  new THREE.MeshStandardMaterial({ color: 0x2ecc71,
  side: THREE.DoubleSide
    
  })
)
scene.add(terrainMesh)




// Cannon Trimesh
const terrainShape = new CANNON.Trimesh(vertices, indices);

console.log(terrainShape)
const terrainBody = new CANNON.Body({ mass: 0 })
terrainBody.addShape(terrainShape)
//
terrainBody.position.set(0, 0, 0);
terrainBody.quaternion.setFromEuler(-Math.PI /2,0,0);
world.addBody(terrainBody)


/*
_________seTn
*/

terrainGeo.setIndex(indices);
terrainGeo.computeVertexNormals();

// 4️⃣ Materia




const material1 = new THREE.MeshBasicMaterial({
  color: 'white',
  side: THREE.DoubleSide,
 wireframe:true,
  
});

// 5️⃣ Mesh
const triangleMesh = new THREE.Mesh(terrainGeo, material1);
scene.add(triangleMesh);




  
  
  
  


const triangleVerts = [
    new CANNON.Vec3(-60, 60, 0),
    new CANNON.Vec3(60, 60, 1),
    new CANNON.Vec3(60, -60, 0),
    new CANNON.Vec3(-60, -60,1),
  ];
  const triangleFaces =[[0,1,2,2,3,0]];
  
  const triangleShape = new CANNON.ConvexPolyhedron({ vertices: triangleVerts, 
  faces: triangleFaces 
    
  });
  
  

  
  
  
  const triangleBody = new CANNON.Body({ mass:0});
 
  triangleBody.addShape(triangleShape);
  triangleBody.position.set(0,-0, 0);
  
  triangleBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
  world.addBody(triangleBody);















// ---------------- Sphere ----------------
const radius = 0.7

// Cannon
const sp = new CANNON.Sphere(radius)
const sphereBody = new CANNON.Body({
  mass: 2,
 // shape: new CANNON.Sphere(radius),
  //position: new CANNON.Vec3(0, 8, 0)
})
sphereBody.addShape(sp)
sphereBody.position.set(2,8, -2);
world.addBody(sphereBody)

// Three
const sphereMesh = new THREE.Mesh(
  new THREE.SphereGeometry(radius),
  new THREE.MeshStandardMaterial({ color: 'orange',
  wireframe:true,
    
  })
)
scene.add(sphereMesh)

// ---------------- Light ----------------
scene.add(new THREE.AmbientLight(0xffffff, 0.4))
const light = new THREE.DirectionalLight(0xffffff, 1)
light.position.set(10, 15, 10)
scene.add(light)

// ---------------- Animate ----------------
/* OrbitControls */
const controls = new OrbitControls(camera, renderer.domElement);
controls.autoRotate=true


//_____________________
const boxGeo = new THREE.BoxGeometry(2,2,2);
const boxMat = new THREE.MeshStandardMaterial({ color: 0xff0000,
wireframe:true,
  
});
const boxMesh = new THREE.Mesh(boxGeo, boxMat);


const boxShape = new CANNON.Box(new CANNON.Vec3(1,1,1));
//const boxShape = new CANNON.Sphere(0.5); 


const boxBody = new CANNON.Body({ mass: 1 });
boxBody.addShape(boxShape);
boxBody.position.set(-0, 6, -4);
boxBody.quaternion.setFromEuler(0, 0, 0);

scene.add(boxMesh);
world.addBody(boxBody);





function animate() {
  requestAnimationFrame(animate)

  world.step(1 / 60)
  controls.update();
terrainMesh.position.copy(terrainBody.position)
terrainMesh.quaternion.copy(terrainBody.quaternion)

triangleMesh.position.copy(triangleBody.position);
    triangleMesh.quaternion.copy(triangleBody.quaternion);




  sphereMesh.position.copy(sphereBody.position)
  sphereMesh.quaternion.copy(sphereBody.quaternion)

boxMesh.position.copy(boxBody.position);
boxMesh.quaternion.copy(boxBody.quaternion);



  renderer.render(scene, camera)
}

animate()

  </script>
</body>
